
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports | تسجيل الدخول</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.3)),
      url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1800&q=85")
      center/cover no-repeat fixed;
    color: white;
}

.login-box {
    width: 100%;
    max-width: 420px;
    padding: 35px 28px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 22px;
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

h1 {
    text-align: center;
    color: #ff9d24;
    margin-bottom: 12px;
}

p {
    text-align: center;
    color: #eee;
    margin-bottom: 25px;
    line-height: 1.7;
}

label {
    display: block;
    margin: 14px 0 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    outline: none;
    background: rgba(255,255,255,.95);
    font-size: 16px;
}

input:focus {
    border: 2px solid #ff9d24;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #ff941f;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: white;
    transform: translateY(-2px);
}

#message {
    margin-top: 15px;
    color: #ffcb9c;
    line-height: 1.7;
}

@media(max-width: 480px) {
    .login-box {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<div class="login-box">
    <h1>SPORTS ZONE</h1>
    <p>ابدأ رحلتك نحو جسم صحي ولياقة أفضل 💪</p>

    <form id="loginForm">
        <label for="username">الاسم الكامل</label>
        <input id="username" type="text"
               placeholder="اكتب اسمك" required>

        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email"
               placeholder="example@email.com" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password"
               placeholder="6 أحرف على الأقل"
               minlength="6" required>

        <button type="submit">تسجيل الدخول ←</button>
        <div id="message" role="status"></div>
    </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!name || !email || password.length < 6) {
        message.textContent = "من فضلك أكمل البيانات بشكل صحيح.";
        return;
    }

    // نمرر الاسم للصفحة الرئيسية فقط
    const destination = "home.html?name=" + encodeURIComponent(name);
    window.location.href = destination;
});
</script>

</body>
</html>
